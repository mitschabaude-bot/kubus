name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build-args: kubus
          test: false
          lint: false
      - name: Tests (with --selfcheck)
        run: tests/run.sh
      - name: Fuzz
        run: tests/fuzz.sh 16 ci-${{ github.run_number }} --keep fuzz-out
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-out
          path: fuzz-out

  model:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: model
          use-mathlib-cache: true
          build-args: Model
          test: false
          lint: false
      - name: Axioms of the consistency theorems
        working-directory: model
        run: |
          lake env lean ci/Axioms.lean > axioms.out
          cat axioms.out
          diff axioms.out ci/axioms.expected
